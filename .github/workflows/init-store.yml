name: init-store
on: workflow_dispatch
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create encrypted store on jsonblob
        run: |
          set -e
          if ! grep -q '__BLOB__' index.html; then echo "already initialised"; exit 0; fi
          curl -sS -L -D /tmp/h -o /tmp/b -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' --data @seed.enc.json https://jsonblob.com/api/jsonBlob || true
          echo "--- headers"; cat /tmp/h; echo "--- body"; head -c 300 /tmp/b; echo
          loc=$(tr -d '\r' < /tmp/h | awk 'tolower($1)=="location:"{print $2}' | tail -1)
          id=${loc##*/}
          [ -z "$id" ] && id=$(tr -d '\r' < /tmp/h | awk 'tolower($1)=="x-jsonblob-id:"{print $2}' | tail -1)
          echo "blob id: $id"
          test -n "$id"
          curl -sSf "https://jsonblob.com/api/jsonBlob/$id" -o /dev/null
          sed -i "s/__BLOB__/$id/" index.html
          git config user.name "shift-bot"
          git config user.email "shift-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Connect encrypted store"
          git push
